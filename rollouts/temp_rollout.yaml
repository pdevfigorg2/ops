apiVersion: v1
kind: Service
metadata:
  name: rollout 
spec:
  selector:
    app: nginx
  ports:
  - port: 8080
    targetPort: 80
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: example-rollout
  namespace: default
spec:
  replicas: 6
  selector:
    matchLabels: 
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
  minReadySeconds: 30
  revisionHistoryLimit: 3
  strategy:
    canary: #Indicates that the rollout should use the Canary strategy
      maxSurge: '25%'
      maxUnavailable: 0
      steps:
        - setWeight: 10
        - pause: {} # pause indefinitely
        - setWeight: 25
        - pause: 
            duration: 10s
        - setWeight: 50
        - pause: 
            duration: 10s
        - setWeight: 75
        - pause: 
            duration: 10s
        - setWeight: 100