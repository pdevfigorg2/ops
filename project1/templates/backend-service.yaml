apiVersion: v1
kind: Service
metadata:
  name: {{ include "project1.nameWithEnv" . }}-backend-service
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ include "project1.nameWithEnv" . }}-backend-service
    {{- include "project1.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }} 
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: project1-backend
  ports:
    - name: {{ .Values.backend.service.portName }} 
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.targetPort }}